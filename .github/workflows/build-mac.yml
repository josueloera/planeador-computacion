name: Build Mac Universal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Build Mac Universal Installer
      run: npm run dist -- --mac --universal

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: mac-installer
        path: dist/*.dmg
